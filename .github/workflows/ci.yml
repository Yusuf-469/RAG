name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (no models, no API key needed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only PyTorch (the default Linux wheel bundles ~2.5 GB of CUDA)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  docker:
    name: Docker image builds and imports
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: meddoc-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (package imports, models baked in, runs offline)
        run: |
          docker run --rm meddoc-rag:ci python -c "
          import app.api, meddoc_rag
          from sentence_transformers import SentenceTransformer, CrossEncoder
          SentenceTransformer('BAAI/bge-small-en-v1.5'); CrossEncoder('cross-encoder/ms-marco-MiniLM-L-6-v2')
          print('image OK')"
