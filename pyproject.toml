[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meddoc-rag"
version = "0.1.0"
description = "Citation-grounded Q&A over public healthcare guidelines, with measurable retrieval evaluation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
    "requests>=2.32,<3",
    "pymupdf>=1.24,<2",
    "tokenizers>=0.19,<1",
    "numpy>=1.26,<3",
    "faiss-cpu>=1.8,<2",
    "sentence-transformers>=5.0,<6",
    "rank-bm25>=0.2.2,<0.3",
    "snowballstemmer>=2.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.38,<2",
]
dev = [
    "pytest>=8.2,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests import the top-level `app` package
