# Source documents for the MedDoc RAG corpus.
#
# PDFs are NOT committed (licensing + repo size). `scripts/download_docs.py`
# rebuilds data/raw/ from this file and verifies each file's SHA-256, so every
# eval number is tied to the exact bytes that were indexed.
#
# manual: true  -> the publisher blocks scripted downloads; open `source_page`
#                  in a browser, save the PDF as data/raw/<filename>, and the
#                  script will still verify the checksum.
# sha256: null  -> not pinned yet; the script prints the hash to paste in.

